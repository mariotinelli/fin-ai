interface:
  display_name: "Project Slices"
  short_description: "Slice Features or scopes with safe resume"
  default_prompt: "Use $project-slices to process this approved project-flow Feature or scope, present one complete DEV and QA publication preview for my approval, and publish only that authorized content to Redmine with safe resume."
dependencies:
  tools:
    - type: "mcp"
      value: "redmine"
      description: "Authenticated Feature checks and approved child publication"
policy:
  allow_implicit_invocation: true
